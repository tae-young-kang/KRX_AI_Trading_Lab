name: Offline safety and regression tests

on:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/offline-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-offline:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python modules
        run: python -m compileall -q app tests
      - name: Run offline tests only
        # Disable common HTTP client egress during tests, after dependencies are installed.
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: python -m pytest -q tests --ignore=tests/test_scan_ui.py
